name: Build Android APK

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release & Debug Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Android SDK Platform 34 & Build-Tools 34.0.0
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Run unit price & logic tests
        run: npm test

      - name: Build and Sign Release Android APK
        run: |
          chmod +x ./scripts/build-apk.sh
          ./scripts/build-apk.sh

      - name: Upload Signed Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartGroceryComparator-v1.2.0-apk
          path: |
            SmartGroceryComparator-v1.0.0.apk
            release/SmartGroceryComparator-v1.0.0-release.apk
